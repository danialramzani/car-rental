<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="اجاره خودرو آسان، سریع و مطمئن"
    >

    <title>اجاره خودرو | رنتو</title>

    <link rel="stylesheet" href="./src/output.css">
</head>

<body class="bg-background text-text">

    <!-- Header -->
    <header class="px-4 pt-4 sm:px-6">

        <nav
            class="mx-auto flex h-18 max-w-7xl items-center justify-between rounded-2xl bg-white px-5 shadow-sm sm:px-7"
            aria-label="ناوبری اصلی"
        >

<!-- Logo -->
<a
    href="#"
    class="flex shrink-0 items-center gap-2.5"
    aria-label="رنتو - صفحه اصلی"
>
    <img
        src="./src/image/rento-logo.png"
        alt=""
        class="size-14 shrink-0 object-contain"
    >

    <span class="font-morabba text-3xl font-bold text-primary">
        رنتو
    </span>
</a>

            <!-- Navigation -->
            <ul class="hidden items-center gap-8 md:flex">

                <li>
                    <a
                        href="#booking"
                        class="font-dana text-sm text-text transition-colors duration-200 hover:text-primary"
                    >
                        رزرو خودرو
                    </a>
                </li>

                <li>
                    <a
                        href="#services"
                        class="font-dana text-sm text-muted transition-colors duration-200 hover:text-primary"
                    >
                        خدمات ما
                    </a>
                </li>

                <li>
                    <a
                        href="#blog"
                        class="font-dana text-sm text-muted transition-colors duration-200 hover:text-primary"
                    >
                        بلاگ
                    </a>
                </li>

                <li>
                    <a
                        href="#about"
                        class="font-dana text-sm text-muted transition-colors duration-200 hover:text-primary"
                    >
                        درباره ما
                    </a>
                </li>

                <li>
                    <a
                        href="#contact"
                        class="font-dana text-sm text-muted transition-colors duration-200 hover:text-primary"
                    >
                        تماس با ما
                    </a>
                </li>

            </ul>


            <!-- Actions -->
            <div class="flex items-center gap-3">

                <!-- Search -->
                <button
                    type="button"
                    class="text-muted transition-colors duration-200 hover:text-primary"
                    aria-label="جستجو"
                >
                    <svg
                        class="size-5"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        aria-hidden="true"
                    >
                        <circle
                            cx="11"
                            cy="11"
                            r="7"
                        />

                        <path
                            stroke-linecap="round"
                            d="m20 20-4-4"
                        />
                    </svg>
                </button>


                <!-- Account -->
                <a
                    href="#login"
                    class="flex items-center gap-2 rounded-xl bg-secondary px-4 py-2.5 font-dana text-sm font-medium text-white transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
                >

                    <svg
                        class="size-5"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.8"
                        aria-hidden="true"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.5 20.25a7.5 7.5 0 0 1 15 0"
                        />
                    </svg>

                    <span>
                        ورود / ثبت‌نام
                    </span>

                </a>

            </div>

        </nav>

    <main>
